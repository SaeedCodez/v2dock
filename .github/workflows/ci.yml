name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        run: cd ui && npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Geo data for tests
        run: |
          mkdir -p dev/assets
          curl -fsSL -o dev/assets/geoip.dat  https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip-lite.dat
          curl -fsSL -o dev/assets/geosite.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite-lite.dat
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
